# CI runs on every push to main and on pull requests targeting main.
#
# Jobs run in parallel:
#   test             — go test -race (unit tests only)
#   integration-test — go test -tags integration -race (testcontainers spins up
#                      real Postgres + Redis using the runner's Docker daemon)
#   lint             — golangci-lint
#   docker-build     — builds both service images without pushing

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test -tags integration -race -timeout 120s -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build ingestion-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: eventpulse/ingestion-api:ci

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: eventpulse/worker:ci
