# CI runs on every push to main and on pull requests targeting main.
#
# Jobs run in parallel:
#   test        — go test -race (unit tests only; integration tests require
#                 testcontainers/Docker and are run locally via `make test-integration`)
#   lint        — golangci-lint
#   docker-build — builds both service images without pushing
#
# To run integration tests in CI, add a service container for Postgres + Redis
# and pass the `integration` build tag: go test -tags integration ./...

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build ingestion-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: eventpulse/ingestion-api:ci

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: eventpulse/worker:ci
