<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', monospace" font-size="13">

  <!-- Background -->
  <rect width="720" height="370" fill="#0f1117" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">k6 Load Test Results — Single Host (Windows 11)</text>

  <!-- ── Labels column ── -->
  <!-- Row 1: Smoke -->
  <text x="14" y="80" fill="#94a3b8" font-size="11">Smoke (1 VU)</text>
  <!-- Row 2: 50-key -->
  <text x="14" y="150" fill="#94a3b8" font-size="11">50-key · 1,000 VU</text>
  <!-- Row 3: 100-key -->
  <text x="14" y="220" fill="#94a3b8" font-size="11">100-key · 1,000 VU</text>
  <!-- Row 4: Combined -->
  <text x="14" y="290" fill="#94a3b8" font-size="11">Combined (3 scenarios)</text>

  <!-- ── Chart area starts at x=170, width=440 ── -->
  <!-- Scale: max RPS = 1976, bar width = 440 → scale = 440/1976 ≈ 0.2227 -->

  <!-- Gridlines at 500, 1000, 1500 RPS -->
  <line x1="281" y1="50" x2="281" y2="315" stroke="#1e293b" stroke-width="1"/>
  <line x1="392" y1="50" x2="392" y2="315" stroke="#1e293b" stroke-width="1"/>
  <line x1="503" y1="50" x2="503" y2="315" stroke="#1e293b" stroke-width="1"/>

  <!-- X-axis tick labels -->
  <text x="170" y="332" fill="#475569" font-size="10" text-anchor="middle">0</text>
  <text x="281" y="332" fill="#475569" font-size="10" text-anchor="middle">500</text>
  <text x="392" y="332" fill="#475569" font-size="10" text-anchor="middle">1,000</text>
  <text x="503" y="332" fill="#475569" font-size="10" text-anchor="middle">1,500</text>
  <text x="610" y="332" fill="#475569" font-size="10" text-anchor="middle">2,000 req/s</text>

  <!-- X-axis base line -->
  <line x1="170" y1="315" x2="614" y2="315" stroke="#334155" stroke-width="1"/>

  <!-- ── Row 1: Smoke (1 VU) — total 254 req/s ── -->
  <!-- Total RPS bar: 254 * 0.2227 = 56.6 -->
  <rect x="170" y="60" width="57" height="18" fill="#6366f1" rx="3" opacity="0.85"/>
  <!-- Ingested bar: 10 * 0.2227 = 2.2 -->
  <rect x="170" y="80" width="2" height="10" fill="#22c55e" rx="1" opacity="0.85"/>
  <!-- Stats -->
  <text x="234" y="72" fill="#e2e8f0" font-size="11">254 req/s total</text>
  <text x="234" y="87" fill="#64748b" font-size="10">~10 ingested · p95 = 10 ms · 0% 5xx</text>

  <!-- ── Row 2: 50-key · 1,000 VU — total 1297 req/s ── -->
  <!-- Total RPS bar: 1297 * 0.2227 = 288.9 -->
  <rect x="170" y="130" width="289" height="18" fill="#6366f1" rx="3" opacity="0.85"/>
  <!-- Ingested bar: 127 * 0.2227 = 28.3 -->
  <rect x="170" y="150" width="28" height="10" fill="#22c55e" rx="1" opacity="0.85"/>
  <!-- Stats -->
  <text x="467" y="142" fill="#e2e8f0" font-size="11">1,297 req/s total</text>
  <text x="206" y="157" fill="#64748b" font-size="10">~127 ingested · p95 = 657 ms · 0.008% 5xx</text>

  <!-- ── Row 3: 100-key · 1,000 VU — total 1976 req/s ── -->
  <!-- Total RPS bar: 1976 * 0.2227 = 440 -->
  <rect x="170" y="200" width="440" height="18" fill="#6366f1" rx="3" opacity="0.9"/>
  <!-- Ingested bar: 282 * 0.2227 = 62.8 -->
  <rect x="170" y="220" width="63" height="10" fill="#22c55e" rx="1" opacity="0.85"/>
  <!-- Stats -->
  <text x="618" y="212" fill="#e2e8f0" font-size="11" text-anchor="end">1,976 req/s</text>
  <text x="241" y="227" fill="#64748b" font-size="10">~282 ingested · p95 = 547 ms · 0% 5xx</text>

  <!-- ── Row 4: Combined (ingest + batch + analytics) — total 706 req/s ── -->
  <!-- Total RPS bar: 706 * 0.2227 = 157.2 -->
  <rect x="170" y="270" width="157" height="18" fill="#27b3cc" rx="3" opacity="0.85"/>
  <!-- Accepted bar: ~210/s * 0.2227 = 46.8 -->
  <rect x="170" y="290" width="47" height="10" fill="#22c55e" rx="1" opacity="0.85"/>
  <!-- Stats -->
  <text x="335" y="282" fill="#e2e8f0" font-size="11">706 req/s (3 scenarios)</text>
  <text x="225" y="297" fill="#64748b" font-size="10">analytics p95 = 22.9 ms · batch 1k events/s · 0% 5xx</text>

  <!-- ── Legend ── -->
  <rect x="170" y="344" width="12" height="8" fill="#6366f1" rx="2" opacity="0.85"/>
  <text x="186" y="352" fill="#94a3b8" font-size="11">Ingest-only RPS</text>
  <rect x="310" y="344" width="12" height="8" fill="#27b3cc" rx="2" opacity="0.85"/>
  <text x="326" y="352" fill="#94a3b8" font-size="11">Combined scenarios</text>
  <rect x="480" y="344" width="12" height="8" fill="#22c55e" rx="2" opacity="0.85"/>
  <text x="496" y="352" fill="#94a3b8" font-size="11">Accepted (202)</text>

</svg>
